<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proofmate : historique</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7; --card: #ffffff; --fg: #1d1d1f; --muted: #6e6e73;
      --border: #d2d2d7; --track: #ececf0; --accent: #4f46e5; --accent-fg: #ffffff; --del: #c62828; --ins: #2e7d32;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111114; --card: #1a1a19; --fg: #f0efec; --muted: #a1a1aa;
        --border: #3a3a40; --track: #2a2a2e; --accent: #818cf8; --accent-fg: #111114; --del: #ef9a9a; --ins: #a5d6a7;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 16px 48px; background: var(--bg); color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    a { color: var(--accent); }
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 24px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .lead { color: var(--muted); margin: 4px 0 20px; }

    .periods { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    .periods button {
      font: inherit; font-size: 14px; padding: 5px 14px; border: none; cursor: pointer;
      background: var(--card); color: var(--fg);
    }
    .periods button + button { border-left: 1px solid var(--border); }
    .periods button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .tile-value { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tile-label { color: var(--muted); font-size: 13px; }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 8px 12px; align-items: center; }
    .bar-label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .bar-track { height: 10px; background: var(--track); border-radius: 0 4px 4px 0; }
    .bar { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
    .bar-value { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }

    details { border-top: 1px solid var(--border); }
    details:first-of-type { border-top: none; }
    summary { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "›"; color: var(--muted); margin-left: 4px; transition: transform .15s; }
    details[open] summary::after { transform: rotate(90deg); }
    .rule { font-weight: 600; flex: 1; }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
    .examples { list-style: none; margin: 0 0 12px 18px; padding: 0; }
    .examples li + li { margin-top: 10px; }

    .entries { list-style: none; margin: 0; padding: 0; }
    .entries li { padding: 10px 0; border-top: 1px solid var(--border); }
    .entries li:first-child { border-top: none; padding-top: 0; }
    .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .diff { margin: 0; }
    del { color: var(--del); }
    ins { color: var(--ins); text-decoration: none; font-weight: 600; }
    .explanation { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

    .empty { color: var(--muted); margin: 0; }
    .danger {
      font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
      background: none; border: 1px solid var(--border); color: var(--del);
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Historique</h1>
      <a href="options.html">Réglages</a>
    </div>
    <p class="lead">Tes erreurs d'anglais relevées par Proofmate, pour repérer tes points faibles.</p>

    <div class="periods" role="group" aria-label="Période">
      <button type="button" data-days="7">7 jours</button>
      <button type="button" data-days="30">30 jours</button>
      <button type="button" data-days="0">Tout</button>
    </div>

    <div id="content"></div>

    <p><button class="danger" type="button" id="clear">Effacer l'historique</button></p>
  </main>
  <script src="categories.js"></script>
  <script src="history.js"></script>
</body>
</html>
